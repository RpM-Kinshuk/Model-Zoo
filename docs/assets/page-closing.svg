<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="134" viewBox="0 0 1200 134" role="img" aria-labelledby="title desc">
  <title id="title">Open spectral closing composition</title>
  <desc id="desc">Airy gold, blue, green and lavender curves settle into a quiet center, with scattered matrix tiles and translucent color washes. The background is transparent and unframed. Decorative only.</desc>
  <style>@media (prefers-color-scheme: dark) { [mask] path { opacity: .72; } }</style>
  <defs>
    <radialGradient id="gold"><stop stop-color="#edbd55" stop-opacity=".12"/><stop offset="1" stop-color="#edbd55" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#58ac90" stop-opacity=".10"/><stop offset="1" stop-color="#58ac90" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset=".18" stop-color="white"/><stop offset=".82" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="edges"><rect width="1200" height="134" fill="url(#fade)"/></mask>
  </defs>
  <ellipse cx="307" cy="69" rx="215" ry="63" fill="url(#gold)"/>
  <ellipse cx="892" cy="65" rx="216" ry="61" fill="url(#mint)"/>
