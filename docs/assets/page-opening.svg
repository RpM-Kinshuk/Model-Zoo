    <path d="M24 70C196 57 298 135 454 94S699 44 839 84S1007 91 1176 74" stroke="#4588ae" opacity="0.54"/>
    <path d="M24 76C196 66 298 132 454 92S699 48 839 87S1007 86 1176 84" stroke="#419779" opacity="0.28"/>
