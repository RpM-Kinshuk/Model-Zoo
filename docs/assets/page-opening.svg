<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-labelledby="title desc">
  <title id="title">Open matrix and spectral composition</title>
  <desc id="desc">Floating matrix tiles dissolve into fine gold, blue, green and lavender ribbons across a transparent canvas. Soft color washes fade into the page, with no enclosing panel or border. Decorative artwork, not measured data.</desc>
  <style>@media (prefers-color-scheme: dark) { [mask] path { opacity: .78; } }</style>
  <defs>
    <radialGradient id="gold"><stop stop-color="#edbd55" stop-opacity=".16"/><stop offset="1" stop-color="#edbd55" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#58ac90" stop-opacity=".12"/><stop offset="1" stop-color="#58ac90" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset=".13" stop-color="white"/><stop offset=".84" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="edges"><rect width="1200" height="164" fill="url(#fade)"/></mask>
  </defs>
  <ellipse cx="265" cy="76" rx="220" ry="74" fill="url(#gold)"/>
  <ellipse cx="929" cy="83" rx="218" ry="79" fill="url(#mint)"/>
