<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
  <title id="title">From a weight matrix to its spectrum</title>
  <desc id="desc">An illustrative diagonal weight matrix with entries 4, 3, 2, 1 has singular values 4, 3, 2, 1. Squaring and sorting them gives eigenvalues 1, 4, 9, 16. Model-Zoo computes spectrum-based rank, norm and entropy measurements and fits a power-law tail when a valid fit exists. The four-value example is an illustration, not evidence of power-law behavior.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6db"/><stop offset="0.5" stop-color="#f6f0eb"/><stop offset="1" stop-color="#ebe8f7"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#53779e" stroke-width="1.3"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="430" rx="16" fill="url(#paper)" stroke="#dbcfaa"/>
  <g fill="none" stroke-width="1.1" opacity="0.27"><path d="M835 77C909 77 913 19 960 19S1035 78 1171 78" stroke="#bb8b26"/><path d="M835 66C909 66 913 8 960 8S1035 67 1171 67" stroke="#7161ac"/><path d="M835 88C909 88 913 30 960 30S1035 89 1171 89" stroke="#258a73"/></g>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="28" y="27" width="5" height="24" rx="2" fill="#fdb515"/>
    <text x="47" y="46" font-family="DejaVu Serif, Georgia, serif" font-size="28" fill="#003262">From a weight matrix to its spectrum</text>
    <text x="47" y="74" font-size="17" fill="#52647a">A change of representation makes matrix structure measurable.</text>

    <rect x="28" y="101" width="344" height="224" rx="12" fill="#fff" stroke="#d7e1ec"/>
    <text x="49" y="134" font-size="16" font-weight="700" letter-spacing="1" fill="#003262">01 / WEIGHTS</text>
    <text x="288" y="135" font-size="18" font-style="italic" fill="#52647a">W</text>
    <path d="M95 156H85V295H95M305 156H315V295H305" fill="none" stroke="#7f95ad" stroke-width="2"/>
    <rect x="105" y="160" width="41" height="28" rx="4" fill="#f2bd3d"/>
    <rect x="155" y="194" width="41" height="28" rx="4" fill="#006ce4"/>
    <rect x="205" y="228" width="41" height="28" rx="4" fill="#69b49a"/>
    <rect x="255" y="262" width="41" height="28" rx="4" fill="#e3daf6"/>
    <g font-size="18" text-anchor="middle">
      <text x="125" y="181" fill="#533d09">4</text><text x="175" y="181" fill="#92a2b5">0</text><text x="225" y="181" fill="#92a2b5">0</text><text x="275" y="181" fill="#92a2b5">0</text>
      <text x="125" y="215" fill="#92a2b5">0</text><text x="175" y="215" fill="#fff">3</text><text x="225" y="215" fill="#92a2b5">0</text><text x="275" y="215" fill="#92a2b5">0</text>
      <text x="125" y="249" fill="#92a2b5">0</text><text x="175" y="249" fill="#92a2b5">0</text><text x="225" y="249" fill="#003262">2</text><text x="275" y="249" fill="#92a2b5">0</text>
      <text x="125" y="283" fill="#92a2b5">0</text><text x="175" y="283" fill="#92a2b5">0</text><text x="225" y="283" fill="#92a2b5">0</text><text x="275" y="283" fill="#003262">1</text>
    </g>

    <path d="M381 213H416" fill="none" stroke="#53779e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="428" y="101" width="344" height="224" rx="12" fill="#fff" stroke="#d7e1ec"/>
    <text x="449" y="134" font-size="16" font-weight="700" letter-spacing="1" fill="#003262">02 / SINGULAR VALUES</text>
    <g font-size="17" fill="#52647a">
      <text x="455" y="178">s₁</text><text x="455" y="213">s₂</text><text x="455" y="248">s₃</text><text x="455" y="283">s₄</text>
    </g>
    <rect x="489" y="159" width="207" height="24" rx="4" fill="#f2bd3d"/>
    <rect x="489" y="194" width="155" height="24" rx="4" fill="#006ce4"/>
    <rect x="489" y="229" width="104" height="24" rx="4" fill="#69b49a"/>
    <rect x="489" y="264" width="52" height="24" rx="4" fill="#e3daf6"/>
    <g font-size="18" font-weight="700" fill="#003262">
      <text x="710" y="178">4</text><text x="657" y="213">3</text><text x="606" y="248">2</text><text x="555" y="283">1</text>
    </g>

    <path d="M781 213H816" fill="none" stroke="#53779e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="828" y="101" width="344" height="224" rx="12" fill="#fff" stroke="#a8d1bd"/>
    <text x="849" y="134" font-size="16" font-weight="700" letter-spacing="1" fill="#00693e">03 / SQUARED SPECTRUM</text>
    <text x="849" y="163" font-size="17" fill="#52647a">λ = s² · sorted</text>
    <path d="M868 190V288H1133" fill="none" stroke="#b4c2d2" stroke-width="1.5"/>
    <path d="M902 288V281" stroke="#9272be" stroke-width="3"/>
    <path d="M969 288V263" stroke="#39967b" stroke-width="3"/>
    <path d="M1036 288V232" stroke="#006ce4" stroke-width="3"/>
    <path d="M1103 288V189" stroke="#e2aa28" stroke-width="3"/>
    <circle cx="902" cy="281" r="5" fill="#9272be"/><circle cx="969" cy="263" r="5" fill="#39967b"/><circle cx="1036" cy="232" r="5" fill="#006ce4"/><circle cx="1103" cy="189" r="5" fill="#e2aa28"/>
    <g font-size="18" text-anchor="middle" font-weight="700" fill="#004b2d">
      <text x="902" y="266">1</text><text x="969" y="248">4</text><text x="1036" y="217">9</text><text x="1103" y="174">16</text>
    </g>
    <text x="1003" y="312" font-size="14" text-anchor="middle" fill="#52647a">eigenvalue index</text>

    <rect x="28" y="345" width="1144" height="37" rx="6" fill="#003262"/>
    <text x="47" y="370" font-size="17" fill="#ffda80">Measurements</text>
    <text x="235" y="370" font-size="17" fill="#fff8e9">norm + rank</text>
    <text x="489" y="370" font-size="17" fill="#fff8e9">spectral entropy</text>
    <text x="827" y="370" font-size="17" fill="#fff8e9">power-law tail + KS, when fitted</text>
    <text x="28" y="411" font-size="15" fill="#52647a">Illustrative 4 × 4 matrix. A computed spectrum does not by itself establish a power law or predict model quality.</text>
  </g>
</svg>
