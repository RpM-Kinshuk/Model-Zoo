[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "model-zoo"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["evidence", "evidence.*", "zoo", "zoo.*"]
exclude = ["evidence.tests", "evidence.tests.*", "zoo.tests", "zoo.tests.*"]
